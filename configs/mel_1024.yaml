name: mel_1024

# Ground-truth-mel sanity check (experiment/mel-hifigan-sanity branch, see
# notes/DECISIONS.md#mel-hifigan-sanity): identical to configs/smoke_1024.yaml (the MuQ+MRF-1024
# baseline) in every respect EXCEPT the two changes structurally forced by conditioning on a
# different representation with a different measured frame rate:
#
#   1. encoder_type: ground_truth_mel (+ the ground_truth_mel: section) instead of muq. There is
#      no learned upstream model here -- conditioning is a deterministic log-mel spectrogram
#      computed directly from the target waveform crop itself (the classic vocoder "copy
#      synthesis" sanity check: can the current generator/discriminator/training recipe memorize
#      two clips at all when given the exact representation HiFi-GAN was designed to consume?).
#   2. decoder.upsample_rates: [5, 5, 4, 3] (product 300) instead of [8, 6, 5, 4] (product 960),
#      and training.crop_frames: 160 instead of 50 -- both required because the ground-truth mel
#      spectrogram's measured samples-per-frame ratio is 300, not MuQ's 960 (confirmed by the
#      Gate-0-style diagnostics printed at the start of any `train` run against this config). The
#      crop LENGTH in samples/seconds is unchanged (160 * 300 = 50 * 960 = 48000 samples = 2.0s)
#      -- only the encoder-frame-counting units differ, per CLAUDE.md's Decoder Design item 3.
#
# Every other field (base_channels, resblock design, losses, discriminator, training schedule,
# optimizer betas, the two fixed clips) is byte-identical to configs/smoke_1024.yaml. Do not edit
# any of those fields here without also updating smoke_1024.yaml, or this stops being a valid
# single-variable (conditioning-source-only) comparison.

environment:
  seed: 0
  device: auto
  allow_cpu_fallback: false
  dtype: float32

encoder_type: ground_truth_mel

ground_truth_mel:
  n_fft: 2048
  hop_length: 300
  win_length: 1200
  n_mels: 128
  fmin: 0.0
  fmax: 12000.0

muq:
  model_id: OpenMuQ/MuQ-large-msd-iter
  sample_rate: 24000

data:
  raw_dir: data/raw/gtzan
  processed_dir: data/processed
  manifests_dir: data/manifests
  source: "hf:marsyas/gtzan"
  expected_track_count: 1000
  original_sample_rate: 22050
  target_sample_rate: 24000
  split_seed: 1234
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

cache:
  cache_dir: data/cache
  dtype: float32
  representation_name: last_hidden_state

feature_contract:
  probe_durations_seconds: [1.0, 2.0, 5.0, 10.0]
  probe_track_count: 3
  frame_rate_tolerance_hz: 0.5
  alignment_tolerance_frames: 1
  lowprecision_dtype: float16
  lowprecision_max_abs_error: 0.05

decoder:
  base_channels: 1024  # unchanged from smoke_1024.yaml
  upsample_rates: [5, 5, 4, 3]  # product 300 -- matches the ground-truth mel's measured
                                 # samples-per-frame ratio (n_fft=2048, hop_length=300)
  resblock_kernel_sizes: [3, 7, 11]  # unchanged
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]  # unchanged

mel_loss:
  n_fft: 2048
  hop_length: 300
  win_length: 1200
  n_mels: 128
  fmin: 0.0
  fmax: 12000.0

stft_loss:
  fft_sizes: [512, 1024, 2048]
  hop_sizes: [50, 120, 240]
  win_lengths: [240, 600, 1200]

discriminator:
  period_periods: [2, 3, 5, 7, 11]
  period_channels: [32, 64, 128, 256, 256]
  period_kernel_size: 5
  period_stride: 3
  scale_channels: [32, 64, 128, 256, 256]
  num_scales: 3

training:
  overfit_track_ids: [pop.00012, disco.00049]  # explicit: guarantee the exact same two tracks
  num_overfit_tracks: 2
  crop_frames: 160  # crop_samples = 160 * 300 = 48000 = same 2.0s crop as smoke_1024.yaml
  steps: 15000
  learning_rate: 0.0002
  log_every: 250
  checkpoint_every: 1000
  loss_decrease_ratio: 0.5
  run_name: gate3_tiny_overfit_mel
  adversarial_warmup_steps: 500
  discriminator_learning_rate: 0.0002
  adversarial_loss_weight: 1.0
  feature_matching_loss_weight: 2.0
  reconstruction_loss_weight: 10.0
  generator_betas: [0.8, 0.99]      # unchanged from smoke_1024.yaml
  discriminator_betas: [0.8, 0.99]  # unchanged from smoke_1024.yaml

pilot:
  track_ids: []
  num_tracks: 3
  crop_frames: 50
  steps: 60
  learning_rate: 0.0002
  log_every: 15
  checkpoint_every: 30
  resume_test_at: 30
  resume_tolerance: 0.02
  control_margin: 0.2
  run_name: gate4_short_pilot_smoke
