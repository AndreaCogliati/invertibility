name: pilot

environment:
  seed: 0
  device: auto
  allow_cpu_fallback: false
  dtype: float32

muq:
  model_id: OpenMuQ/MuQ-large-msd-iter
  sample_rate: 24000

data:
  raw_dir: data/raw/gtzan
  processed_dir: data/processed
  manifests_dir: data/manifests
  source: "hf:marsyas/gtzan"
  expected_track_count: 1000
  original_sample_rate: 22050
  target_sample_rate: 24000
  split_seed: 1234
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1

cache:
  cache_dir: data/cache
  dtype: float32
  representation_name: last_hidden_state

feature_contract:
  probe_durations_seconds: [1.0, 2.0, 5.0, 10.0]
  probe_track_count: 3
  frame_rate_tolerance_hz: 0.5
  alignment_tolerance_frames: 1
  lowprecision_dtype: float16
  lowprecision_max_abs_error: 0.05

decoder:
  base_channels: 512
  upsample_rates: [8, 6, 5, 4]  # product 960 (confirmed exact in Gate 2); 4 stages, not 6, to
                                 # preserve channel width longer through the network
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]

mel_loss:
  n_fft: 2048
  hop_length: 300
  win_length: 1200
  n_mels: 128
  fmin: 0.0
  fmax: 12000.0

stft_loss:
  fft_sizes: [512, 1024, 2048]
  hop_sizes: [50, 120, 240]
  win_lengths: [240, 600, 1200]

training:
  overfit_track_ids: []
  num_overfit_tracks: 2
  crop_frames: 50
  steps: 500
  learning_rate: 0.0002
  log_every: 50
  checkpoint_every: 250
  loss_decrease_ratio: 0.5
  run_name: gate3_tiny_overfit

pilot:
  track_ids: []
  num_tracks: 6
  crop_frames: 50
  steps: 400
  learning_rate: 0.0002
  log_every: 50
  checkpoint_every: 200
  resume_test_at: 200
  resume_tolerance: 0.08  # scaled up from smoke.yaml's 0.02: MPS float drift accumulates
                          # roughly linearly with step count (~0.00025/step, measured across
                          # configs -- see notes/DECISIONS.md#gate4-mps-resume-tolerance)
  control_margin: 0.2
  run_name: gate4_short_pilot
