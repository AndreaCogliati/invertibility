# TASK-18 bounded smoke test: the full code path (features, training, checkpoint/resume, every
# control and metric, listening export, outcome rule) on a tiny subset of the TASK-18 manifests.
# Not a result. Runs in a few minutes on MPS/XPU; the subset is taken from the committed manifests.

base_config: configs/task18_heldout.yaml
smoke_limits:
  train_tracks: 4
  heldout_tracks_per_split: 2
  pool_crops_per_track: 4         # first 4 pool crops by index of each kept training track, plus the memorized ones
steps: 40
eval_every: 10
checkpoint_every: 20
log_every: 5
batch_size: 8
bootstrap_samples: 200
run_name_prefix: task18_smoke
run_root: runs/task18_smoke
artifact_root: artifacts/task18_smoke
wandb_group: task18-smoke
