# Intel XPU (e.g. Data Center GPU Max / PVC on TAMU ACES) environment for this project.
#
# Kept separate from the canonical ../../pyproject.toml + ../../uv.lock, which stay the source of
# truth for MPS, CUDA, and CPU. The only difference here is that `torch`, `torchaudio`, and
# `torchvision` come from PyTorch's XPU wheel index (`+xpu` builds, same versions as the canonical
# lock) instead of PyPI's CUDA builds.
# Everything else, including this project's code, resolves exactly as declared in the canonical
# pyproject.
#
#   uv sync --project envs/xpu --frozen
#   uv run --project envs/xpu python scripts/task15_smoke_test.py --device xpu
#
# Linux x86_64 only (the platform XPU wheels are published for).

[project]
name = "muq-inversion-xpu-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "muq-inversion",
    "torch==2.14.0",
    "triton-xpu",
    "torchaudio",
    "torchvision",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Every package shared with the canonical lock is pinned to the canonical version; regenerate this
# list from ../../uv.lock whenever that lock changes (see README "Intel XPU").
