[tool.uv.sources]
muq-inversion = { path = "../..", editable = true }
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }  # torch+xpu needs a newer triton-xpu than PyPI has
# PyPI's Linux torchaudio/torchvision wheels link CUDA (libcudart.so.13), absent here; use the +xpu
# builds of the same versions.
torchaudio = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
