[project]
name = "muq-inversion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrea Cogliati", email = "andrea.cogliati@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.34.0,<1.0",
    "librosa>=1.0.0",
    "muq>=0.1.0",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.0",
    "transformers==4.55.0",
    "wandb>=0.30.0",
]

[project.scripts]
muq-inversion = "muq_inversion:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
